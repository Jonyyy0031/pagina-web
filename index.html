<!doctype html>
<html lang="es">
<head>

  <style>
    :root {
      color-scheme: dark;
      --ink: #101111;
      --paper: #e8e9df;
      --acid: #d3ff45;
      --pink: #ff386b;
      --cyan: #45e8e8;
      --mono: "IBM Plex Mono", monospace;
      --display: "Space Grotesk", sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--ink); }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--paper);
      background: #000 url("ESTILOS/FONDO BLANCO.gif") center center / cover fixed no-repeat;
      font-family: var(--display);
    }

    body::after {
      position: fixed;
      z-index: 4;
      pointer-events: none;
      content: "";
      inset: 0;
      opacity: .14;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, .35) 4px);
      mix-blend-mode: multiply;
    }

    .page-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: clamp(42px, 8vw, 112px) clamp(20px, 5vw, 76px) 88px;
    }

    .masthead {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto clamp(48px, 8vw, 112px);
      text-align: center;
    }

    h1 {
      position: relative;
      margin: 0;
      color: var(--paper);
      font-size: clamp(2.5rem, 8.6vw, 8.5rem);
      font-weight: 700;
      line-height: .88;
      letter-spacing: 0;
      text-transform: uppercase;
      animation: arrive .8s steps(6, end) both;
    }

    h1::before,
    h1::after {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: var(--paper);
      content: attr(data-title);
      pointer-events: none;
    }

    h1::before {
      color: var(--cyan);
      transform: translate(-3px, 1px);
      clip-path: inset(14% 0 68% 0);
      animation: glitch-cyan 4.5s steps(1, end) infinite;
    }

    h1::after {
      color: var(--pink);
      transform: translate(3px, -1px);
      clip-path: inset(72% 0 8% 0);
      animation: glitch-pink 5.2s steps(1, end) infinite;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: clamp(120px, 16vw, 224px);
      grid-auto-flow: dense;
      gap: clamp(10px, 1.4vw, 20px);
      width: 100%;
      margin: 0 auto;
    }

    .frame {
      position: relative;
      min-width: 0;
      overflow: hidden;
      margin: 0;
      background: #282b28;
      isolation: isolate;
      animation: reveal .8s both;
    }

    .frame:nth-child(1) { grid-column: span 5; grid-row: span 2; animation-delay: .08s; }
    .frame:nth-child(2) { grid-column: span 4; grid-row: span 1; animation-delay: .16s; }
    .frame:nth-child(3) { grid-column: span 3; grid-row: span 1; animation-delay: .24s; }
    .frame:nth-child(4) { grid-column: span 3; grid-row: span 1; animation-delay: .32s; }
    .frame:nth-child(5) { grid-column: span 4; grid-row: span 2; animation-delay: .4s; }
    .frame:nth-child(6) { grid-column: span 5; grid-row: span 1; animation-delay: .48s; }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.8) contrast(1.08) brightness(.82);
      transition: filter .45s ease, transform .7s cubic-bezier(.2, .75, .25, 1);
    }

    .frame::before,
    .frame::after {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      content: "";
      inset: 0;
    }

    .frame::before {
      background: linear-gradient(155deg, rgba(15, 242, 226, .12), transparent 42%, rgba(244, 24, 106, .12));
      mix-blend-mode: screen;
      transition: opacity .4s ease;
    }

    .frame::after {
      opacity: .35;
      background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(0, 0, 0, .34) 6px);
      mix-blend-mode: multiply;
    }

    .frame:hover img,
    .frame:focus-within img {
      filter: saturate(1.2) contrast(1.12) brightness(.98);
      transform: scale(1.035);
    }

    .frame:hover::before,
    .frame:focus-within::before { opacity: .7; }

    .frame img[src*="photo-1518837695005"] { object-position: center 62%; }
    .frame img[src*="photo-1500534623283"] { object-position: center 45%; }

    .frame-index {
      position: absolute;
      z-index: 2;
      top: 14px;
      left: 15px;
      color: var(--acid);
      font: 500 11px/1 var(--mono);
      text-shadow: 1px 1px 0 var(--ink);
    }

    .audio-control {
      position: absolute;
      z-index: 3;
      right: 12px;
      bottom: 12px;
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid rgba(232, 233, 223, .65);
      border-radius: 0;
      color: var(--paper);
      background: rgba(16, 17, 17, .78);
      font: 500 10px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: color .2s ease, border-color .2s ease, background .2s ease;
    }

    .audio-control:hover,
    .audio-control:focus-visible {
      border-color: var(--acid);
      color: var(--acid);
      background: rgba(16, 17, 17, .95);
      outline: none;
    }

    .audio-icon {
      position: relative;
      display: block;
      width: 13px;
      height: 14px;
      flex: 0 0 13px;
    }

    .audio-control[data-state="play"] .audio-icon::before {
      position: absolute;
      top: 1px;
      left: 2px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid currentColor;
      content: "";
    }

    .audio-control[data-state="pause"] .audio-icon::before,
    .audio-control[data-state="pause"] .audio-icon::after {
      position: absolute;
      top: 2px;
      width: 3px;
      height: 10px;
      background: currentColor;
      content: "";
    }

    .audio-control[data-state="pause"] .audio-icon::before { left: 2px; }
    .audio-control[data-state="pause"] .audio-icon::after { right: 2px; }

    .audio-picker { display: none; }

    @keyframes arrive {
      0% { opacity: 0; transform: translateY(8px); }
      35% { opacity: .4; transform: translateX(4px); }
      55% { opacity: .85; transform: translateX(-2px); }
      100% { opacity: 1; transform: translate(0); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitch-cyan {
      0%, 91%, 94%, 100% { clip-path: inset(14% 0 68% 0); }
      92% { clip-path: inset(38% 0 49% 0); transform: translate(-7px, 0); }
      93% { clip-path: inset(78% 0 12% 0); transform: translate(2px, 1px); }
    }

    @keyframes glitch-pink {
      0%, 86%, 89%, 100% { clip-path: inset(72% 0 8% 0); }
      87% { clip-path: inset(20% 0 62% 0); transform: translate(6px, -1px); }
      88% { clip-path: inset(58% 0 29% 0); transform: translate(-2px, 1px); }
    }

    @media (max-width: 760px) {
      .page-shell { padding-top: 56px; }
      .masthead { margin-bottom: 48px; }
      .gallery {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-auto-rows: clamp(130px, 31vw, 220px);
      }
      .frame:nth-child(1) { grid-column: span 3; grid-row: span 2; }
      .frame:nth-child(2) { grid-column: span 3; grid-row: span 1; }
      .frame:nth-child(3) { grid-column: span 3; grid-row: span 1; }
      .frame:nth-child(4) { grid-column: span 3; grid-row: span 1; }
      .frame:nth-child(5) { grid-column: span 3; grid-row: span 2; }
      .frame:nth-child(6) { grid-column: span 3; grid-row: span 1; }
    }

    @media (max-width: 480px) {
      .page-shell { padding: 48px 14px 54px; }
      .masthead { margin-bottom: 38px; }
      h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); }
      .gallery { grid-template-columns: 1fr 1fr; grid-auto-rows: 44vw; gap: 9px; }
      .frame:nth-child(n) { grid-column: span 1; grid-row: span 1; }
      .frame:nth-child(1), .frame:nth-child(5) { grid-row: span 2; }
      .audio-control { right: 8px; bottom: 8px; min-height: 38px; gap: 7px; padding: 0 9px; font-size: 9px; }
      .frame-index { top: 10px; left: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

  <script>
    const viewer = document.querySelector(".photo-viewer");
    const viewerImage = viewer.querySelector("img");
    const viewerClose = viewer.querySelector(".viewer-close");
    const viewerPrev = viewer.querySelector(".viewer-prev");
    const viewerNext = viewer.querySelector(".viewer-next");

    document.querySelectorAll(".frame img").forEach((image) => {
      if (image.closest(".zoom-trigger")) return;

      const photoNumber = image.getAttribute("src").match(/FOTO(\d+)/i)?.[1];
      const trigger = document.createElement("button");
      trigger.className = "zoom-trigger";
      trigger.type = "button";
      trigger.setAttribute("aria-label", `Ampliar fotografía ${photoNumber}`);
      image.replaceWith(trigger);
      trigger.append(image);
    });

    const photoTriggers = [...document.querySelectorAll(".zoom-trigger")];
    let activePhotoIndex = 0;

    const showPhoto = (index) => {
      activePhotoIndex = (index + photoTriggers.length) % photoTriggers.length;
      const image = photoTriggers[activePhotoIndex].querySelector("img");
      viewerImage.src = image.src;
      viewerImage.alt = image.alt;
    };

    photoTriggers.forEach((trigger, index) => {
      trigger.addEventListener("click", () => {
        showPhoto(index);
        viewer.showModal();
        viewerClose.focus();
      });
    });

    viewerPrev.addEventListener("click", () => showPhoto(activePhotoIndex - 1));
    viewerNext.addEventListener("click", () => showPhoto(activePhotoIndex + 1));
    viewerClose.addEventListener("click", () => viewer.close());
    document.addEventListener("keydown", (event) => {
      if (!viewer.open) return;
      if (event.key === "Escape") viewer.close();
      if (event.key === "ArrowLeft") showPhoto(activePhotoIndex - 1);
      if (event.key === "ArrowRight") showPhoto(activePhotoIndex + 1);
    });
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) viewer.close();
    });

    document.querySelectorAll(".frame").forEach((frame) => {
      const audio = frame.querySelector(".track");
      const button = frame.querySelector(".audio-control");
      if (!audio || !button) return;

      button.addEventListener("click", () => {
        if (audio.paused) {
          document.querySelectorAll(".track").forEach((otherAudio) => {
            if (otherAudio !== audio) otherAudio.pause();
          });
          audio.play().catch((error) => {
            button.dataset.state = "play";
            console.error(`No se pudo reproducir ${audio.currentSrc || audio.src}`, error);
          });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", () => { button.dataset.state = "pause"; });
      audio.addEventListener("pause", () => { button.dataset.state = "play"; });
      audio.addEventListener("ended", () => { button.dataset.state = "play"; });
    });
  </script>
